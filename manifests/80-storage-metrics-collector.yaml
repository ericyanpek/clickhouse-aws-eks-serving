# Host disk counter collector for benchmark nodes. It resolves ClickHouse data
# mounts to block-device major:minor IDs before reading cumulative Linux
# counters, excluding the EBS root disk from benchmark metrics.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: storage-metrics-collector
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: storage-metrics-collector
  template:
    metadata:
      labels:
        app: storage-metrics-collector
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: clickhouse
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - clickhouse-local-benchmark
                      - clickhouse-ebs
      containers:
        - name: collector
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              printf 'epoch\tnode\tdevice\tmodel\treads\tsectors_read\tread_ms\twrites\tsectors_written\twrite_ms\tio_ms\tweighted_io_ms\n'
              while true; do
                epoch=$(date +%s)
                : >/tmp/clickhouse-data-devices
                while IFS=' ' read -r _mount_id _parent_id major_minor _mount_root mount_point _mount_rest; do
                  case "$mount_point" in
                    /mnt/disks/*)
                      printf '%s\n' "$major_minor" >>/tmp/clickhouse-data-devices
                      ;;
                    /var/lib/kubelet/pods/*/volumes/kubernetes.io~csi/*/mount)
                      volume_data="/host${mount_point%/mount}/vol_data.json"
                      if grep -Eq '"driverName"[[:space:]]*:[[:space:]]*"ebs.csi.aws.com"' "$volume_data" 2>/dev/null; then
                        printf '%s\n' "$major_minor" >>/tmp/clickhouse-data-devices
                      fi
                      ;;
                  esac
                done </host/proc/1/mountinfo
                sort -u /tmp/clickhouse-data-devices >/tmp/clickhouse-data-devices.sorted

                while read -r major minor device reads _reads_merged sectors_read read_ms writes _writes_merged sectors_written write_ms _in_flight io_ms weighted_io_ms _rest; do
                  case "$device" in
                    nvme*n1) ;;
                    *) continue ;;
                  esac
                  grep -Fxq "$major:$minor" /tmp/clickhouse-data-devices.sorted || continue
                  model=$(tr -d '\n' <"/host/sys/block/$device/device/model" 2>/dev/null || true)
                  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                    "$epoch" "$NODE_NAME" "$device" "$model" "$reads" "$sectors_read" "$read_ms" \
                    "$writes" "$sectors_written" "$write_ms" "$io_ms" "$weighted_io_ms"
                done </host/proc/diskstats
                sleep 10
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-kubelet
              mountPath: /host/var/lib/kubelet
              readOnly: true
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
